{% extends "base.html" %}
{% block title %}Профиль{% endblock %}
{% block content %}
<h1 class="mb-4"><i class="bi bi-person-gear"></i> Профиль</h1>
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ user.username }}</h5>
                <p class="text-muted">Полное имя: {{ user.full_name or 'Не указано' }}</p>
                <hr>
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <form method="post" action="/profile">
                    <div class="mb-3">
                        <label for="telegram_id" class="form-label">Ваш Telegram ID</label>
                        <input type="text" class="form-control" id="telegram_id" name="telegram_id"
                               value="{{ user.telegram_id or '' }}" placeholder="Например, 123456789">
                        <div class="form-text">Узнать свой ID можно у бота @userinfobot</div>
                    </div>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
