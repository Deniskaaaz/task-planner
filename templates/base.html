<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Планировщик задач{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { margin-bottom: 20px; }
        .task-card { transition: transform 0.1s, box-shadow 0.1s; border-left: 4px solid #ccc; }
        .task-card:hover { transform: scale(1.01); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .priority-low { border-left-color: #28a745; }
        .priority-normal { border-left-color: #007bff; }
        .priority-high { border-left-color: #dc3545; }
        .avatar-circle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #6c757d;
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
            margin-right: 2px;
        }
        .comment { border-left: 3px solid #dee2e6; padding-left: 10px; margin-bottom: 10px; }
        .comment .author { font-weight: bold; }
        .comment .time { font-size: 0.8em; color: #6c757d; }
        .status-badge { font-size: 0.8em; }
        .day-column.today { background-color: #fff3cd !important; }
        .day-column.weekend { background-color: #f8f9fa; }
        .tasks-container { transition: background-color 0.2s; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-kanban"></i> Планировщик</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    {% if user %}
                        <li class="nav-item">
                            <a class="nav-link" href="/calendar"><i class="bi bi-calendar-week"></i> Календарь</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/stats"><i class="bi bi-bar-chart-line"></i> Статистика</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/profile"><i class="bi bi-person-circle"></i> {{ user.username }}</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right"></i> Выйти</a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="/login"><i class="bi bi-box-arrow-in-right"></i> Войти</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/register"><i class="bi bi-person-plus"></i> Регистрация</a>
                        </li>
                    {% endif %}
                    <li class="nav-item ms-2">
                        <button id="themeToggle" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-moon-stars"></i> Тема
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Переключение темы
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;
        
        function setTheme(theme) {
            htmlElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('theme', theme);
            updateIcon(theme);
        }
        
        function updateIcon(theme) {
            const icon = themeToggle.querySelector('i');
            if (theme === 'dark') {
                icon.className = 'bi bi-sun';
            } else {
                icon.className = 'bi bi-moon-stars';
            }
        }
        
        // Загрузка сохранённой темы
        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme);
        
        themeToggle.addEventListener('click', () => {
            const current = htmlElement.getAttribute('data-bs-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        });
    </script>
</body>
</html>
